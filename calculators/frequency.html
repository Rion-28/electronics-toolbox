<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>周波数計算機｜電子回路ツールボックス</title><link rel="stylesheet" href="../style.css"></head><body><main><a class="back" href="../">← 計算機一覧</a><header><small>電子回路ツールボックス</small><h1>周波数計算機</h1><div class="muted">周期から周波数を計算・四則演算対応</div></header><section class="panel" id="frequency"><div class="row"><h2>周期 → 周波数</h2><button id="clear">AC</button></div><label for="period">周期 T（数値・数式）</label><input id="period" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例：1/3×4" value="4"><div class="units" id="units"><button data-unit="ns" aria-pressed="false">ns</button><button data-unit="us" aria-pressed="true">µs</button><button data-unit="ms" aria-pressed="false">ms</button><button data-unit="s" aria-pressed="false">s</button></div><div class="keys" id="keys"></div><p class="hint" id="calculated" aria-live="polite"></p><div class="result"><small>周波数 f</small><div class="row"><div id="answer" aria-live="polite">—</div><button id="copy">コピー</button></div></div><div class="values" id="values"></div><p class="hint">f = 1/T（T は秒）<br>分数・小数・四則演算・括弧に対応。例：1/4、2×5、(1/3)×4</p></section><footer>計算処理は端末内で実行</footer></main><script src="../common.js"></script><script>
'use strict';
function parse(raw){let s=raw.normalize('NFKC').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');if(s.length>300)throw Error('数式が長すぎます');let i=0;function atom(){if(s[i]==='+'){i++;return atom()}if(s[i]==='-'){i++;return -atom()}if(s[i]==='('){i++;let v=add();if(s[i++]!==')')throw Error();return v}let m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);if(!m)throw Error();i+=m[0].length;return Number(m[0])}function mul(){let v=atom();while(s[i]==='*'||s[i]==='/'){let op=s[i++],b=atom();if(op==='/'&&b===0)throw Error();v=op==='*'?v*b:v/b}return v}function add(){let v=mul();while(s[i]==='+'||s[i]==='-'){let op=s[i++],b=mul();v=op==='+'?v+b:v-b}return v}let v=add();if(i!==s.length||!Number.isFinite(v)||v<=0)throw Error();return v}
const scales={ns:1e9,us:1e6,ms:1e3,s:1};const bands=[[1e9,'GHz'],[1e6,'MHz'],[1e3,'kHz'],[1,'Hz']];let unit='us',copyText='';
function update(){let t,f;try{t=parse($('period').value);f=scales[unit]/t;if(!Number.isFinite(f)||f<=0)throw Error()}catch{t=f=NaN}let valid=Number.isFinite(f);$('calculated').textContent=valid?'計算後の周期：'+fmt(t)+' '+(unit==='us'?'µs':unit):$('period').value.trim()?'正の周期を表す数式を入力してください。':'周期を入力してください。';let b=bands.find(x=>f>=x[0])||bands[3];copyText=valid?fmt(f/b[0])+' '+b[1]:'';$('answer').textContent=copyText||'—';$('copy').disabled=!valid;$('values').replaceChildren(...bands.map(([n,u])=>{let r=document.createElement('div');r.className='row';let l=document.createElement('span'),v=document.createElement('span');l.textContent=u;v.textContent=valid?fmt(f/n):'—';r.append(l,v);return r}));}
$('units').addEventListener('click',e=>{if(!e.target.dataset.unit)return;unit=e.target.dataset.unit;for(let b of $('units').children)b.setAttribute('aria-pressed',String(b.dataset.unit===unit));update()});$('period').addEventListener('input',update);$('clear').onclick=()=>{$('period').value='';update()};for(let k of ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','(',')','00','+','⌫','AC']){let b=document.createElement('button');b.textContent=k;if('÷×−()+⌫AC'.includes(k))b.className='op';b.onclick=()=>{let inp=$('period');if(k==='AC')inp.value='';else if(k==='⌫')inp.value=inp.value.slice(0,-1);else inp.value+=k;update()};$('keys').append(b)}$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(copyText);$('copy').textContent='コピー済み';setTimeout(()=>$('copy').textContent='コピー',1000)}catch{window.prompt('周波数をコピー',copyText)}};update();

</script></body></html>
