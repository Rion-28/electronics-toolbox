<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>電子回路ツールボックス</title><style>
:root{color-scheme:light dark;--bg:#f2f5fa;--panel:#fff;--fg:#172539;--muted:#65758b;--line:#d9e1eb;--accent:#125caa;--soft:#eaf2ff} @media(prefers-color-scheme:dark){:root{--bg:#10151e;--panel:#192331;--fg:#e9f0f9;--muted:#a5b5ca;--line:#344155;--accent:#8bbdff;--soft:#243b59}} *{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:var(--fg);background:var(--bg)}main{max-width:600px;margin:0 auto;padding:24px 15px 40px}header{margin-bottom:24px}h1{font-size:25px;margin:6px 0}h2{font-size:20px;margin:0}small,.muted{color:var(--muted)}.nav{display:flex;gap:8px;margin-bottom:14px}.nav a{background:var(--soft);border-radius:9px;color:var(--accent);padding:10px 15px;text-decoration:none;font-weight:650}.panel{padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}label{display:block;margin:20px 0 8px;color:var(--muted);font-size:14px}input{width:100%;font:inherit;font-size:26px;padding:13px;border:1px solid var(--line);border-radius:10px;color:var(--fg);background:var(--bg)}button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;touch-action:manipulation}button:active{opacity:.7}.units,.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.units button[aria-pressed=true],.op{background:var(--soft);color:var(--accent)}.units button[aria-pressed=true]{border-color:var(--accent);font-weight:700}.keys button{font-size:20px;min-height:48px}.result{margin-top:20px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#answer{font-size:clamp(25px,7vw,40px);font-weight:750;color:var(--accent);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.values{margin:12px 0}.values .row{padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.values span:last-child{text-align:right;overflow-wrap:anywhere}.hint{font-size:13px;color:var(--muted);line-height:1.6}footer{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}
</style></head><body><main><header><small>ENGINEERING TOOLBOX / v1.0</small><h1>電子回路ツールボックス</h1><div class="muted">実験・設計用の計算機ライブラリ</div></header><nav class="nav"><a href="#frequency">周波数計算</a></nav><section class="panel" id="frequency"><div class="row"><h2>周期 → 周波数</h2><button id="clear">AC</button></div><label for="period">周期 T（数値・数式）</label><input id="period" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例：1/3×4" value="4"><div class="units" id="units"><button data-unit="ns" aria-pressed="false">ns</button><button data-unit="us" aria-pressed="true">µs</button><button data-unit="ms" aria-pressed="false">ms</button><button data-unit="s" aria-pressed="false">s</button></div><div class="keys" id="keys"></div><p class="hint" id="calculated" aria-live="polite"></p><div class="result"><small>周波数 f</small><div class="row"><div id="answer" aria-live="polite">—</div><button id="copy">コピー</button></div></div><div class="values" id="values"></div><p class="hint">f = 1/T（T は秒）<br>分数・小数・四則演算・括弧に対応。例：1/4、2×5、(1/3)×4</p></section><footer>計算処理は端末内で実行</footer></main><script>
'use strict';
function parse(raw){let s=raw.normalize('NFKC').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');if(s.length>300)throw Error('数式が長すぎます');let i=0;function atom(){if(s[i]==='+'){i++;return atom()}if(s[i]==='-'){i++;return -atom()}if(s[i]==='('){i++;let v=add();if(s[i++]!==')')throw Error();return v}let m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);if(!m)throw Error();i+=m[0].length;return Number(m[0])}function mul(){let v=atom();while(s[i]==='*'||s[i]==='/'){let op=s[i++],b=atom();if(op==='/'&&b===0)throw Error();v=op==='*'?v*b:v/b}return v}function add(){let v=mul();while(s[i]==='+'||s[i]==='-'){let op=s[i++],b=mul();v=op==='+'?v+b:v-b}return v}let v=add();if(i!==s.length||!Number.isFinite(v)||v<=0)throw Error();return v}
const scales={ns:1e9,us:1e6,ms:1e3,s:1};const bands=[[1e9,'GHz'],[1e6,'MHz'],[1e3,'kHz'],[1,'Hz']];const $=id=>document.getElementById(id);let unit='us',copyText='';const fmt=n=>n===0?'0':n<1e-6||n>=1e15?n.toExponential(7):n.toLocaleString('en-US',{maximumSignificantDigits:10});
function update(){let t,f;try{t=parse($('period').value);f=scales[unit]/t;if(!Number.isFinite(f)||f<=0)throw Error()}catch{t=f=NaN}let valid=Number.isFinite(f);$('calculated').textContent=valid?'計算後の周期：'+fmt(t)+' '+(unit==='us'?'µs':unit):$('period').value.trim()?'正の周期を表す数式を入力してください。':'周期を入力してください。';let b=bands.find(x=>f>=x[0])||bands[3];copyText=valid?fmt(f/b[0])+' '+b[1]:'';$('answer').textContent=copyText||'—';$('copy').disabled=!valid;$('values').replaceChildren(...bands.map(([n,u])=>{let r=document.createElement('div');r.className='row';let l=document.createElement('span'),v=document.createElement('span');l.textContent=u;v.textContent=valid?fmt(f/n):'—';r.append(l,v);return r}));}
$('units').addEventListener('click',e=>{if(!e.target.dataset.unit)return;unit=e.target.dataset.unit;for(let b of $('units').children)b.setAttribute('aria-pressed',String(b.dataset.unit===unit));update()});$('period').addEventListener('input',update);$('clear').onclick=()=>{$('period').value='';update()};for(let k of ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','(',')','00','+','⌫','AC']){let b=document.createElement('button');b.textContent=k;if('÷×−()+⌫AC'.includes(k))b.className='op';b.onclick=()=>{let inp=$('period');if(k==='AC')inp.value='';else if(k==='⌫')inp.value=inp.value.slice(0,-1);else inp.value+=k;update()};$('keys').append(b)}$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(copyText);$('copy').textContent='コピー済み';setTimeout(()=>$('copy').textContent='コピー',1000)}catch{window.prompt('周波数をコピー',copyText)}};update();
</script></body></html>
